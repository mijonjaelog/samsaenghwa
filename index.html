<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>삼생화 三生花 — 상세 소개</title>
<style>
html,body,#page{margin:0;width:100%;height:100%;border:0;background:#171318}
body{overflow:hidden}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#f3e6e8;font-family:"Apple SD Gothic Neo",sans-serif;background:#171318;z-index:2}
</style>
</head>
<body>
<div id="loading">삼생화 상세페이지를 불러오는 중...</div>
<iframe id="page" title="삼생화 상세 소개"></iframe>
<script>
const files=Array.from({length:28},(_,i)=>"parts/part-"+String(i+1).padStart(2,"0")+".htmlpart");
Promise.all(files.map(f=>fetch(f,{cache:"no-store"}).then(r=>{if(!r.ok) throw new Error(f); return r.text();})))
.then(chunks=>{
  const url=URL.createObjectURL(new Blob([chunks.join("")],{type:"text/html"}));
  const frame=document.getElementById("page");
  frame.onload=()=>document.getElementById("loading").remove();
  frame.src=url;
})
.catch(err=>{
  document.getElementById("loading").textContent="페이지를 불러오지 못했습니다: "+err.message;
});
</script>
</body>
</html>
