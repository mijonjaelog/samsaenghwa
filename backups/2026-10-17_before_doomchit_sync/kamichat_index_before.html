      let name = '';

        }

    html = '<!doctype html>\n' + doc.documentElement.outerHTML;

  return html;

/* KAMICHAT COPY PATCH
   Only slash-commands and ten-ending public section are changed.
   Preserve all images, cast data, portraits, original original CSS and pages.
*/
function patchKamichatPage(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.title='삼생화 三生花 | 카미챗 상세 소개';
  const commands=doc.getElementById('commands');
  if(commands){
    const walker=doc.createTreeWalker(commands,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(node=>{node.nodeValue=node.nodeValue.replace(/!([가-힣]+)/g,'/$1');});
  }
  const list=[["E01","각자의 봄","COMMON","비연애 · 공동체 정착"],["E02","내가 고른 계절","COMMON","비연애 · 독립적인 새 출발"],["E03","북령으로 가는 길","RARE","위무진"],["E04","평범한 저녁의 약속","RARE","문지후"],["E05","기록 밖의 이름","RARE","서문령"],["E06","청연당의 여름","RARE","한소담"],["E07","남겨진 여백","RARE","신윤서"],["E08","꽃이 진 뒤에도","EPIC","류서겸"],["E09","두 번의 봄을 지나","EPIC","삼생 진실 · 연애 선택 무관"],["E10","삼생화","LEGENDARY","장기 누적 · 특정 연애 상대 없음"]];
  const section=doc.createElement('section');
  section.className='section';
  section.id='endings';
  section.innerHTML=
    '<div class="kicker">ENDING COLLECTION · 10</div>'+
    '<h2>세 번의 봄, 열 가지 결말.</h2>'+
    '<p class="kami-ending-intro">각자가 걸어간 길 끝에는 서로 다른 결말이 남습니다. 아래는 공개 엔딩의 이름과 담당 인물입니다. 해금 조건과 숨겨진 사건의 진상은 공개하지 않습니다.</p>'+
    '<div class="kami-ending-grid">'+list.map(([number,name,rarity,owner])=>
      '<article class="kami-ending-item">'+
      '<span class="kami-ending-id">'+number+'</span>'+
      '<div><div class="kami-ending-heading"><h3>'+name+'</h3><span class="kami-ending-rarity">'+rarity+'</span></div>'+
      '<p class="kami-ending-owner">'+owner+'</p></div></article>'
    ).join('')+'</div>'+
    '<p class="kami-ending-foot">COMMON 2 · RARE 5 · EPIC 2 · LEGENDARY 1<br>카미챗에서는 /엔딩 명령어로 실제 달성한 엔딩 기록을 조회합니다. 달성 조건은 플레이 중 공개되는 정보만 적용합니다.</p>';
  section.querySelector('.kami-ending-foot')?.remove();
  const play=doc.getElementById('play');
  if(play)play.before(section);else doc.body.appendChild(section);
  const css=doc.createElement('style');
  css.id='kami-endings-extension';
  css.textContent=
   '.kami-ending-intro{max-width:780px;margin:6px 0 23px;color:#795e68;font-size:13px;line-height:1.8}'+
   '.kami-ending-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}'+
   '.kami-ending-item{display:flex;align-items:flex-start;gap:14px;padding:19px 20px;border:1px solid var(--line,#e9d7da);border-radius:5px;background:linear-gradient(150deg,#fff,#fff9f8)}'+
   '.kami-ending-id{flex:0 0 35px;color:var(--rose,#ae6577);font:700 12px Georgia,serif;padding-top:5px}'+
   '.kami-ending-heading{display:flex;gap:9px;align-items:center;flex-wrap:wrap}'+
   '.kami-ending-heading h3{font-size:16px;line-height:1.4;color:#553740;margin:0}'+
   '.kami-ending-rarity{border:1px solid #e4cad1;border-radius:99px;background:#fff6f7;color:#a16676;font:700 9px Arial,sans-serif;letter-spacing:.03em;padding:3px 8px}'+
   '.kami-ending-owner{font-size:12px;color:#8d6673;margin:7px 0 0}'+
   '.kami-ending-foot{margin:19px 0 0;border:1px solid var(--line,#e9d7da);background:#fbf2f3;padding:15px 17px;font-size:12px;color:#84646f;line-height:1.9}'+
   '@media(max-width:680px){.kami-ending-grid{grid-template-columns:1fr}.kami-ending-item{padding:16px 17px}}';
  doc.head.appendChild(css);
  // Preserve existing navigation style by cloning the page's own PLAY button.
  for(const button of doc.querySelectorAll('button[data-target="play"]')){
    const clone=button.cloneNode(true);
    clone.setAttribute('data-target','endings');
    clone.textContent='엔딩 10종';
    button.before(clone);
  }
  let output='<!doctype html>\n'+doc.documentElement.outerHTML;
  // The original scroll/navigation code enumerates section IDs explicitly.
  output=output.replace(/(const\s+sectionIds\s*=\s*\[[^\]]*?)'play'(\s*\];)/g,(_m,a,b)=>a+"'endings','play'"+b);
  return output;
}


/* KAMICHAT LOCATIONS PATCH: preserves the original page, six portraits and existing ending definitions. */

function patchKamichatPlaces(html,placesMarkup){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const placeDoc=new DOMParser().parseFromString(placesMarkup,'text/html');
 const work=placeDoc.querySelector('#places-work');
 const background=placeDoc.querySelector('#places-background');
 if(!work||!background)throw new Error('장소 이미지 원본 로딩 실패');
 if(work.querySelectorAll('.place-card').length!==8||background.querySelectorAll('.place-card').length!==10)
  throw new Error('장소 카드 개수가 다릅니다');
 const section=doc.createElement('section');
 section.className='section';
 section.id='kami-places';
 section.innerHTML='<div class="kicker">WORLD & DAILY LIFE</div><h2>경화에서 살아가는 곳들</h2>';
 const contents=doc.createElement('div');
 contents.className='kami-places-content';
 for(const original of [work,background]){
  const subgroup=doc.createElement('div');
  subgroup.className='kami-subsection';
  subgroup.innerHTML=original.innerHTML;
  subgroup.querySelectorAll('.places-section-note').forEach(node=>node.remove());
  contents.appendChild(subgroup);
 }
 section.appendChild(contents);
 const endings=doc.getElementById('endings');
 const play=doc.getElementById('play');
 if(endings)endings.before(section);else if(play)play.before(section);else doc.body.appendChild(section);
 doc.querySelectorAll('button[data-target="endings"],.nav-btn[data-target="endings"]').forEach(button=>{
  const clone=button.cloneNode(true);
  clone.dataset.target='kami-places';
  clone.textContent='생활·장소';
  button.before(clone);
 });
 const sheet=doc.createElement('style');
 sheet.id='kami-inline-places-v3';
 sheet.textContent="\n#kami-places .kami-places-content{max-width:1060px;margin:0 auto}\n#kami-places .kami-places-content>.kami-subsection{padding:22px 0 26px;scroll-margin-top:96px}\n#kami-places .kami-places-content>.kami-subsection+.kami-subsection{padding-top:39px}\n#kami-places .kami-subsection .kicker{font-size:11px;letter-spacing:.15em;color:#aa7081;font-weight:700}\n#kami-places .places-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}\n#kami-places .places-title-row h2{font-size:clamp(23px,3vw,30px);margin:14px 0;letter-spacing:-.03em}\n#kami-places .places-count{font-size:11px;color:#a35c72;border:1px solid #e7c5cd;border-radius:40px;padding:5px 11px;background:#fff7f8;white-space:nowrap}\n#kami-places .places-intro{color:#79646a;max-width:750px;font-size:13px;line-height:1.8;margin:0 0 22px}\n#kami-places .places-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}\n#kami-places .place-card{overflow:hidden;border:1px solid #ead8dc;border-radius:8px;background:#fff;box-shadow:0 8px 23px rgba(80,47,60,.05);min-width:0}\n#kami-places .place-image-link{display:block;aspect-ratio:4/5;background:#eee0e3;overflow:hidden}\n#kami-places .place-image-link img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .24s}\n#kami-places .place-image-link:hover img{transform:scale(1.04)}\n#kami-places .place-body{padding:14px 15px 17px}\n#kami-places .place-kind{font-size:11px;line-height:1.5;color:#b07484}\n#kami-places .place-body h3{font-size:15px;line-height:1.5;color:#563842;margin:6px 0}\n#kami-places .place-body p{font-size:12px;line-height:1.7;color:#79636b;margin:0}\n#kami-places .places-section-note{display:none}\n@media(max-width:900px){#kami-places .places-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}\n@media(max-width:480px){#kami-places .places-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#kami-places .place-body{padding:11px}#kami-places .place-body h3{font-size:13px}#kami-places .place-body p{font-size:11px}#kami-places .places-count{font-size:10px}}\n";
 doc.head.appendChild(sheet);
 // Disable the original observer, which did not know about newly-added sections.
 for(const script of doc.querySelectorAll('script')){
  const code=script.textContent||'';
  if(!code.includes('const sectionIds')||!code.includes('const observer = new IntersectionObserver'))continue;
  const newCode=code.replace(/const observer = new IntersectionObserver\([\s\S]*?sections\.forEach\(s => observer\.observe\(s\)\);/,
   '/* replaced by kami-scrollspy-v3 */');
  if(newCode===code)throw new Error('기존 메뉴 감지 코드 교체 실패');
  script.textContent=newCode;
 }
 const navCss=doc.createElement('style');
 navCss.id='kami-active-menu-v3';
 navCss.textContent='.sticky-nav .nav-btn.active,.mobile-dock .nav-btn.active{background:#a75a6f!important;color:white!important;border-color:#a75a6f!important}html{scroll-padding-top:0}#kami-places{scroll-margin-top:85px}';
 doc.head.appendChild(navCss);
 const navJs=doc.createElement('script');
 navJs.id='kami-scrollspy-v3';
 navJs.textContent="(function(){\n'use strict';\nconst NAV=[...document.querySelectorAll('.sticky-nav [data-target], .mobile-dock [data-target]')];\nconst IDS=[...new Set(NAV.map(b=>b.dataset.target))].filter(id=>!!document.getElementById(id));\nconst HEAD=document.querySelector('.sticky-nav');\nlet active='',pending=0,holdUntil=0;\nfunction h(){return Math.ceil(HEAD?.getBoundingClientRect().height||75)}\nfunction select(id,force){\n if(!id||(active===id&&!force))return;\n active=id;\n for(const b of NAV){\n  const on=b.dataset.target===id;\n  b.classList.toggle('active',on);\n  if(on)b.setAttribute('aria-current','location');else b.removeAttribute('aria-current');\n }\n const current=NAV.find(b=>b.dataset.target===id&&b.closest('.sticky-nav'))||NAV.find(b=>b.dataset.target===id);\n const rail=current?.parentElement;\n if(rail&&rail.scrollWidth>rail.clientWidth+12)rail.scrollTo({left:Math.max(0,current.offsetLeft-(rail.clientWidth-current.offsetWidth)/2),behavior:'instant'});\n}\nfunction scan(){\n pending=0;\n if(performance.now()<holdUntil)return;\n const marker=h()+Math.min(110,innerHeight*0.19);\n let best=IDS[0];\n for(const id of IDS){\n  const section=document.getElementById(id);\n  if(section&&section.getBoundingClientRect().top<=marker)best=id;\n }\n if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)best=IDS[IDS.length-1];\n select(best);\n}\nfunction sync(){if(!pending)pending=requestAnimationFrame(scan)}\nfor(const btn of NAV)btn.addEventListener('click',()=>{\n const id=btn.dataset.target;\n if(!IDS.includes(id))return;\n select(id,true);\n holdUntil=performance.now()+500;\n setTimeout(()=>{holdUntil=0;sync()},620);\n});\naddEventListener('scroll',sync,{passive:true});\naddEventListener('resize',sync,{passive:true});\naddEventListener('pageshow',sync);\nif('ResizeObserver'in window){const observer=new ResizeObserver(sync);if(HEAD)observer.observe(HEAD)}\ndocument.fonts?.ready.then(sync);sync();\n})();";
 doc.body.appendChild(navJs);
 return '<!doctype html>\n'+doc.documentElement.outerHTML;
}
