  if(!html.includes('id="offices"')){

      let name = '';

  return html;

/* PLATFORM PAGE: original character imagery and text remain unchanged.
   The same layout and scroll tracking are applied to Doomchit and Kamichat. */
function extendSamsaenghwaPage(html, placesMarkup, platform) {
 const doc=new DOMParser().parseFromString(html,'text/html');
 const rawPlaces=new DOMParser().parseFromString(placesMarkup,'text/html');
 const isKami=platform==='kamichat';
 doc.title='삼생화 三生花 | '+(isKami?'카미챗':'둠칫')+' 상세 소개';
 const commands=doc.querySelector('#commands');
 if(isKami&&commands){
   const walker=doc.createTreeWalker(commands,NodeFilter.SHOW_TEXT);
   let node;while((node=walker.nextNode()))node.nodeValue=node.nodeValue.replace(/!([가-힣]+)/g,'/$1');
 }
 const list=ENDING_RECORDS;
 const ep=doc.createElement('section');
 ep.id='endings';ep.className='section';
 ep.innerHTML='<div class="kicker">ENDING COLLECTION</div>'+
   '<h2>세 번의 봄, 열 가지 결말.</h2>'+
   '<p class="ending-intro">각자가 걸어온 길 끝에 서로 다른 결말이 남습니다. 엔딩 이름과 담당 인물을 소개하며, 달성 조건과 숨겨진 진상은 공개하지 않습니다.</p>'+
   '<div class="ending-collection">'+list.map(([id,name,rank,npc])=>
    '<article class="ending-card"><span class="ending-id">'+id+'</span><div class="ending-info">'+
    '<div class="ending-title-row"><h3>'+name+'</h3><span class="ending-rank">'+rank+'</span></div>'+
    '<p class="ending-owner">'+npc+'</p></div></article>').join('')+'</div>';
 const placeSection=doc.createElement('section');
 placeSection.id='places';placeSection.className='section';
 placeSection.innerHTML='<div class="kicker">WORLD & DAILY LIFE</div><h2>경화에서 살아가는 곳들</h2>';
 const placeWrap=doc.createElement('div');
 placeWrap.className='page-places';
 for(const [id,count] of [['places-work',8],['places-background',10]]){
  const group=rawPlaces.getElementById(id);
  if(!group||group.querySelectorAll('.place-card').length!==count)throw Error('장소 '+id+' 이미지 개수 불일치');
  const part=doc.createElement('div');
  part.className='page-places-group';
  part.innerHTML=group.innerHTML;
  part.querySelectorAll('.places-section-note').forEach(x=>x.remove());
  placeWrap.appendChild(part);
 }
 placeSection.appendChild(placeWrap);
 const play=doc.getElementById('play');
 if(!play)throw Error('원본 플레이 섹션을 찾을 수 없습니다');
 play.before(placeSection,ep);
 // Add both new targets before the existing Play button, matching page order.
 for(const menu of doc.querySelectorAll('.sticky-nav,.mobile-dock')){
  const playButton=menu.querySelector('button[data-target="play"]');
  if(!playButton)continue;
  for(const [id,label] of [['places','생활·장소'],['endings','엔딩 10종']]){
   const btn=playButton.cloneNode(true);
   btn.classList.remove('active');
   btn.dataset.target=id;btn.textContent=label;

const SCROLL_TRACKING_JS="(function(){\n'use strict';\nconst menu=[...document.querySelectorAll('.sticky-nav .nav-btn,.mobile-dock .nav-btn')];\nconst nav=document.querySelector('.sticky-nav');\nconst targets=[...new Set(document.querySelectorAll('.sticky-nav .nav-btn'))].map(b=>b.dataset.target).filter(id=>document.getElementById(id));\nlet current='',frame=0,holdUntil=0;\nfunction choose(id,force){\n if(!id||(id===current&&!force))return;\n current=id;\n for(const button of menu){const yes=button.dataset.target===id;button.classList.toggle('active',yes);if(yes)button.setAttribute('aria-current','location');else button.removeAttribute('aria-current')}\n const btn=menu.find(b=>b.dataset.target===id&&b.closest('.sticky-nav'));\n const rail=btn?.parentElement;\n if(rail&&rail.scrollWidth>rail.clientWidth+8){\n  const left=btn.offsetLeft-(rail.clientWidth-btn.offsetWidth)/2;\n  rail.scrollTo({left:Math.max(0,left),behavior:'instant'});\n }\n}\nfunction sync(){\n frame=0;if(performance.now()<holdUntil)return;\n const marker=(nav?.getBoundingClientRect().height||60)+Math.min(110,innerHeight*.17);\n let id=targets[0];\n for(const target of targets){const el=document.getElementById(target);if(el&&el.getBoundingClientRect().top<=marker)id=target}\n if(innerHeight+scrollY>=document.documentElement.scrollHeight-3)id=targets[targets.length-1];\n choose(id);\n}\nfunction request(){if(!frame)frame=requestAnimationFrame(sync)}\nfor(const btn of menu)btn.addEventListener('click',()=>{\n const id=btn.dataset.target;if(!targets.includes(id))return;\n choose(id,true);holdUntil=performance.now()+460;\n setTimeout(()=>{holdUntil=0;request()},580);\n});\naddEventListener('scroll',request,{passive:true});addEventListener('resize',request,{passive:true});\naddEventListener('pageshow',request);\nif('ResizeObserver'in window){const ro=new ResizeObserver(request);if(nav)ro.observe(nav)}\ndocument.fonts?.ready.then(request);request();\n})();";
